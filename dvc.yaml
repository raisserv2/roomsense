# The RoomSense CI pipeline as a DVC DAG (`dvc dag` draws it, `dvc repro` runs it).
# Each stage reruns only when one of its deps or params changed, so a new
# nightly data snapshot or a changed hyper-parameter rebuilds exactly what it
# affects. Run it through `python scripts/run_pipeline.py` to also record the
# run (status, timings, throughput) for the Pipeline page of the web UI.
stages:
  prepare:
    cmd: python3 scripts/prepare.py
    deps:
      - scripts/prepare.py
      - data/raw
    params:
      - prepare
    outs:
      - data/processed/manifest.csv
    metrics:
      - reports/prepare_report.json:
          cache: false
  preprocess:
    cmd: python scripts/preprocess.py
    deps:
      - scripts/preprocess.py
      - data/processed/manifest.csv
      - data/raw
    params:
      - preprocess
    outs:
      - data/processed/clean_manifest.csv
      - data/processed/images
      - reports/clusters
    metrics:
      - reports/preprocess_report.json:
          cache: false
  split:
    cmd: python3 scripts/split.py --seed ${split.seed} --val ${split.val} --test ${split.test}
    deps:
      - scripts/split.py
      - data/processed/clean_manifest.csv
    params:
      - split
      - data
    outs:
      - data/processed/splits.csv
    metrics:
      - reports/split_report.json:
          cache: false
  train:
    cmd: python scripts/train.py
    deps:
      - scripts/train.py
      - roomsense/calibration.py
      - roomsense/evalmetrics.py
      - data/processed/splits.csv
      - data/processed/images
    params:
      - train
    outs:
      - models/best.pt
      - models/classes.json
      - models/calibration.json
      - models/train_run.json:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/confusion_matrix.png:
          cache: false
  export:
    cmd: python scripts/export.py
    deps:
      - scripts/export.py
      - roomsense/frames.py
      - roomsense/drift.py
      - roomsense/onnx_eval.py
      - roomsense/evalmetrics.py
      - models/best.pt
      - models/classes.json
      - models/calibration.json
      - data/processed/splits.csv
      - data/processed/images
    params:
      - export
    outs:
      - models/model.onnx
      - models/model_meta.json
    metrics:
      - reports/export_report.json:
          cache: false
  register:
    cmd: python scripts/register.py
    deps:
      - scripts/register.py
      - roomsense/registry.py
      - models/model.onnx
      - models/model_meta.json
    params:
      - register
    metrics:
      - reports/register_report.json:
          cache: false
