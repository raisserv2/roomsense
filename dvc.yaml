stages:
  prepare:
    cmd: python3 scripts/prepare.py
    deps:
      - scripts/prepare.py
      - data/raw
    outs:
      - data/processed/manifest.csv
  preprocess:
    cmd: python scripts/preprocess.py
    deps:
      - scripts/preprocess.py
      - data/processed/manifest.csv
      - data/raw
    params:
      - preprocess
    outs:
      - data/processed/clean_manifest.csv
      - data/processed/images
      - reports/clusters
    metrics:
      - reports/preprocess_report.json:
          cache: false
  split:
    cmd: python3 scripts/split.py --seed ${split.seed} --val ${split.val} --test ${split.test}
    deps:
      - scripts/split.py
      - data/processed/clean_manifest.csv
    params:
      - split
      - data
    outs:
      - data/processed/splits.csv
    metrics:
      - reports/split_report.json:
          cache: false
  train:
    cmd: python scripts/train.py
    deps:
      - scripts/train.py
      - data/processed/splits.csv
      - data/processed/images
    params:
      - train
    outs:
      - models/best.pt
      - models/classes.json
      - models/train_run.json:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false
  export:
    cmd: python scripts/export.py
    deps:
      - scripts/export.py
      - roomsense/frames.py
      - roomsense/drift.py
      - roomsense/onnx_eval.py
      - models/best.pt
      - models/classes.json
      - data/processed/splits.csv
      - data/processed/images
    params:
      - export
    outs:
      - models/model.onnx
      - models/model_meta.json
    metrics:
      - reports/export_report.json:
          cache: false
  register:
    cmd: python scripts/register.py
    deps:
      - scripts/register.py
      - models/model.onnx
      - models/model_meta.json
    params:
      - register
    metrics:
      - reports/register_report.json:
          cache: false
