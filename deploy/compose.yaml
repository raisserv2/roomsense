# RoomSense serving + monitoring stack (runs on nova).
#   cd ~/roomsense/deploy && cp .env.example .env && nano .env
#   docker network create roomsense     # once; shared with the capture service
#   docker compose up -d --build
# Every port is bound to 127.0.0.1 and published to the tailnet with Tailscale
# Serve (see README). Nothing is reachable from the room network or the internet.

name: roomsense

x-restart: &restart
  restart: unless-stopped

networks:
  default:
    name: roomsense
    external: true

services:
  mlflow:
    <<: *restart
    build: ./mlflow
    image: roomsense-mlflow:3.17.2
    container_name: roomsense-mlflow
    user: "1000:1000"
    environment:
      HOME: /mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts ${MLFLOW_ALLOWED_HOSTS:-mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1:5000}
      --cors-allowed-origins ${MLFLOW_CORS_ORIGINS:-https://nova.tailb5cb87.ts.net:5443}
    volumes:
      - ./data/mlflow:/mlflow
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s

  api:
    <<: *restart
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    image: roomsense-api
    container_name: roomsense-api
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Fail fast when MLflow is down: the API keeps serving the model it already has.
      MLFLOW_HTTP_REQUEST_TIMEOUT: "15"
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
      STATE_DIR: /state
      ROOT_PATH: /api
    volumes:
      - ./data/api:/state
    ports:
      - "127.0.0.1:${API_PORT:-8300}:8000"
    depends_on:
      - mlflow

  frontend:
    <<: *restart
    build: ./frontend
    image: roomsense-frontend
    container_name: roomsense-frontend
    # The UI knows the backend only through these two settings (loose coupling):
    #   API_UPSTREAM  where nginx forwards /api/ (any host:port that speaks the REST API)
    #   API_BASE_URL  what the browser calls: "api/" = through nginx on the same origin,
    #                 or a full URL of the API (then set CORS_ORIGINS on the API side)
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://api:8000}
      API_BASE_URL: ${API_BASE_URL:-api/}
      LINK_GRAFANA: ${LINK_GRAFANA:-3443}
      LINK_MLFLOW: ${LINK_MLFLOW:-5443}
      LINK_PROMETHEUS: ${LINK_PROMETHEUS:-6443}
      LINK_CAPTURE: ${LINK_CAPTURE:-7443}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8200}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.5.0
    container_name: roomsense-prometheus
    user: "1000:1000"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=60d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./data/prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"

  alertmanager:
    <<: *restart
    image: prom/alertmanager:v0.28.1
    container_name: roomsense-alertmanager
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - ./data/alertmanager:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"

  grafana:
    <<: *restart
    image: grafana/grafana:12.0.2
    container_name: roomsense-grafana
    user: "1000:1000"
    environment:
      GF_PATHS_DATA: /var/lib/grafana/data
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/roomsense.json
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana/data
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    depends_on:
      - prometheus

  # --- exporters: every component of the stack is visible in Prometheus -------
  # Host metrics of nova (CPU, memory, disks, temperature, battery).
  node-exporter:
    <<: *restart
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.9.1}
    container_name: roomsense-node-exporter
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run|var/lib/docker/.+|var/lib/containerd/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave

  # Per-container CPU, memory and restarts for every container on nova.
  # (0.55+ understands Docker's containerd image store. With an older Docker,
  # CADVISOR_IMAGE=gcr.io/cadvisor/cadvisor:v0.49.1 in .env also works.)
  cadvisor:
    <<: *restart
    image: ${CADVISOR_IMAGE:-ghcr.io/google/cadvisor:0.56.2}
    container_name: roomsense-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,memory_numa,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  # Request counts of the frontend's nginx (from its stub_status page).
  nginx-exporter:
    <<: *restart
    image: ${NGINX_EXPORTER_IMAGE:-nginx/nginx-prometheus-exporter:1.4.2}
    container_name: roomsense-nginx-exporter
    command:
      - --nginx.scrape-uri=http://frontend:80/stub_status
    depends_on:
      - frontend

  # Optional: the registry's champion model behind MLflow's own REST server.
  #   docker compose --profile mlflow-serve up -d mlflow-serve
  #   curl -X POST http://127.0.0.1:5001/invocations -H 'Content-Type: application/json' -d @request.json
  mlflow-serve:
    profiles: ["mlflow-serve"]
    <<: *restart
    image: roomsense-mlflow:3.17.2
    container_name: roomsense-mlflow-serve
    user: "1000:1000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      HOME: /tmp
    command: >
      mlflow models serve -m models:/roomsense@champion
      --host 0.0.0.0 --port 5001 --env-manager local --workers 1
    ports:
      - "127.0.0.1:${MLFLOW_SERVE_PORT:-5001}:5001"
    depends_on:
      - mlflow
