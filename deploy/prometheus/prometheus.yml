global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# One job per component, so `up{job=...}` says at a glance what is alive.
scrape_configs:
  - job_name: roomsense-api          # model, drift, camera, pipeline, HTTP metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: roomsense-capture      # data ingestion: frames saved, camera errors, dataset size
    static_configs:
      - targets: ["roomsense-capture:8100"]
  - job_name: frontend               # nginx request counters
    static_configs:
      - targets: ["nginx-exporter:9113"]
  - job_name: node                   # the nova host: CPU, memory, disks, temperature, battery
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor               # every container: CPU, memory, restarts
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
  # MLflow has no metrics page. Its liveness is exported by the API as
  # roomsense_dependency_up{dependency="mlflow"}, its resources by cAdvisor.
