services:
  capture:
    build: .
    container_name: roomsense-capture
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      DATA_DIR: /data/raw
      TRASH_DIR: /data/trash
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ../data:/data
    networks:
      - default
      - roomsense

# Shared with the RoomSense serving stack (deploy/), so the API can read the
# active capture session as ground truth. Create once: docker network create roomsense
networks:
  roomsense:
    external: true
